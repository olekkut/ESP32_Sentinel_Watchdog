<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 632" width="960" height="632" role="img" aria-labelledby="t d">
<title id="t">ESP32 Sentinel Watchdog - LED signal patterns</title>
<desc id="d">PWM duty cycle of the GPIO 2 LED over time for the four firmware patterns: Wi-Fi breathing (838 ms period, peak 86 percent), success heartbeat (135 ms double pulse), error flash (3 x 40 ms, 240 ms) and touch-wake strobe (2 x 15 ms, 55 ms).</desc>
<style>
  .card  { fill:#ffffff; stroke:#d0d7de; }
  .panel { fill:#f6f8fa; }
  .t1 { fill:#1f2328; font:600 20px system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif; }
  .t2 { fill:#59636e; font:400 13px system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif; }
  .pt { fill:#1f2328; font:600 15px system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif; }
  .ps { fill:#59636e; font:400 12.5px system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif; }
  .tick { fill:#818b98; font:400 11px system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif; font-variant-numeric:tabular-nums; }
  .ann { fill:#59636e; font:500 11.5px system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif; }
  .grid { stroke:#e1e4e8; stroke-width:1; }
  .axis { stroke:#c3c8cf; stroke-width:1; }
  .annl { stroke:#818b98; stroke-width:1; fill:none; }
  .line { stroke:#2a78d6; stroke-width:2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
  .area { fill:#2a78d6; fill-opacity:.10; }
  .chip { fill:#2a78d6; }
  @media (prefers-color-scheme: dark) {
    .card  { fill:#0d1117; stroke:#30363d; }
    .panel { fill:#161b22; }
    .t1, .pt { fill:#f0f6fc; }
    .t2, .ps, .ann { fill:#9198a1; }
    .tick { fill:#7d8590; }
    .grid { stroke:#262c36; }
    .axis { stroke:#3d444d; }
    .annl { stroke:#7d8590; }
    .line { stroke:#3987e5; }
    .area { fill:#3987e5; fill-opacity:.14; }
    .chip { fill:#3987e5; }
  }
</style>
